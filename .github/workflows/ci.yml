name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  library:
    uses: minisource/.github/.github/workflows/library-ci.yml@main
    with:
      language: go
      go-version: "1.24"
    secrets: inherit
